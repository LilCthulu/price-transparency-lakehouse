[project]
name = "price-transparency-lakehouse"
version = "0.1.0"
description = "CMS hospital price files for Middle Tennessee, from raw MRF to a public cost comparison app."
requires-python = ">=3.13"

[tool.ruff]
line-length = 110
extend-exclude = ["scratch", "airflow/logs"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
